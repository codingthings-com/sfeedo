[package]
name = "sfeedo"
version = "0.1.4"
description = "Sfeedo - Desktop Feed Reader"
authors = ["codingthings.com"]
license = "See LICENSE file"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sfeedo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-log = "2"
finance-news-aggregator-rs = "0.2.2"
# finance-news-aggregator-rs= { path = "../../finance-news-aggregator-rs"} 
# finance-news-aggregator-rs = { git = "https://github.com/codingthings-com/finance-news-aggregator-rs", branch = "integtests" }

tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.0"
env_logger = "0.10"
