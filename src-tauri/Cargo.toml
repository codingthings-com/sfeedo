[package]
name = "sfeedo"
version = "0.1.12"
description = "Sfeedo - Desktop Feed Reader"
authors = ["codingthings.com"]
license = "See LICENSE file"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sfeedo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-log = "2.9.1"
finance-news-aggregator-rs = "0.2.2"
# finance-news-aggregator-rs= { path = "../../finance-news-aggregator-rs"} 
# finance-news-aggregator-rs = { git = "https://github.com/codingthings-com/finance-news-aggregator-rs", branch = "integtests" }

tokio = { version = "1.53.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.20"
futures = "0.3.30"

[dev-dependencies]
tempfile = "3.27.0"
env_logger = "0.11.11"
