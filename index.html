<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sfeedo</title>
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Header with navigation -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">sfeedo</h1>
                <nav class="main-nav">
                    <button class="nav-btn active" data-view="articles">
                        <span class="nav-icon">📰</span>
                        Articles
                    </button>
                    <button class="nav-btn" data-view="settings">
                        <span class="nav-icon">⚙️</span>
                        Settings
                    </button>
                </nav>
                <div class="header-actions">
                    <button id="refresh-btn" class="action-btn" title="Refresh feeds">
                        <span class="refresh-icon">🔄</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main content area -->
        <main class="app-main">
            <!-- Articles view -->
            <div id="articles-view" class="view active">
                <div class="view-header">
                    <h2>Latest Articles</h2>
                    <div class="view-controls">
                        <select id="sort-select" class="control-select">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                        </select>
                    </div>
                </div>
                <div id="articles-container" class="articles-container">
                    <!-- Articles will be loaded here -->
                </div>
            </div>

            <!-- Settings view -->
            <div id="settings-view" class="view">
                <div class="view-header">
                    <h2>Settings</h2>
                </div>
                <div class="settings-container">
                    <!-- Settings content will be loaded here -->
                </div>
            </div>
        </main>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p class="loading-text">Loading...</p>
            </div>
        </div>

        <!-- Status bar -->
        <footer class="status-bar">
            <div class="status-content">
                <span id="status-text" class="status-text">Ready</span>
                <div class="status-indicators">
                    <span id="auto-refresh-indicator" class="indicator hidden">Auto-refresh: ON</span>
                    <span id="last-update" class="last-update">Never updated</span>
                </div>
            </div>
        </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/components/articles.js"></script>
    <script type="module" src="/src/components/settings.js"></script>
    <script type="module" src="/src/components/refresh.js"></script>
</body>
</html>
