<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFEEDO TELETEXT</title>
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <div id="app">
        <!-- Teletext Header -->
        <header class="teletext-header">
            <div class="teletext-title-bar">
                <span class="teletext-logo">SFEEDO</span>
                <span class="teletext-page-info">P100</span>
            </div>
            <div class="teletext-nav">
                <button class="teletext-nav-btn active" data-view="articles">
                    100 NEWS
                </button>
                <button class="teletext-nav-btn" data-view="settings">
                    200 SETUP
                </button>
                <button id="refresh-btn" class="teletext-refresh-btn">
                    REFRESH
                </button>
            </div>
        </header>

        <!-- Main teletext content -->
        <main class="teletext-main">
            <!-- Articles view -->
            <div id="articles-view" class="teletext-view active">
                <div class="teletext-view-header">
                    <div class="teletext-header-line">
                        <span class="teletext-section-title">FINANCIAL NEWS</span>
                        <div class="teletext-sort-controls">
                            <button id="sort-up-btn" class="teletext-sort-btn active" data-sort="newest">▲</button>
                            <button id="sort-down-btn" class="teletext-sort-btn" data-sort="oldest">▼</button>
                        </div>
                    </div>
                </div>
                <div id="articles-container" class="teletext-articles">
                    <!-- Articles will be loaded here -->
                </div>
            </div>

            <!-- Settings view -->
            <div id="settings-view" class="teletext-view">
                <div class="teletext-view-header">
                    <span class="teletext-section-title">SYSTEM SETUP</span>
                </div>
                <div class="settings-container">
                    <!-- Settings content will be loaded here -->
                </div>
            </div>
        </main>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="teletext-loading hidden">
            <div class="teletext-loading-content">
                <div class="teletext-spinner">█</div>
                <p class="teletext-loading-text">LOADING...</p>
            </div>
        </div>

        <!-- Status bar -->
        <footer class="teletext-status">
            <div class="teletext-status-content">
                <span id="status-text" class="teletext-status-text">READY</span>
                <div class="teletext-status-indicators">
                    <span id="auto-refresh-indicator" class="teletext-indicator hidden">AUTO: ON</span>
                    <span id="last-update" class="teletext-last-update">NEVER UPDATED</span>
                </div>
            </div>
        </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/components/articles.js"></script>
    <script type="module" src="/src/components/settings.js"></script>
    <script type="module" src="/src/components/refresh.js"></script>
</body>
</html>
